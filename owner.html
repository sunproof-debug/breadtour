<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가게 꾸미기 · 세웅이형과 함께하는 대전 빵지순례 v5.0</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fff8ec; --paper:#fffdf8; --butter:#f7c948; --crust:#8a5a36; --crust-2:#5a3a1a; --berry:#e8546a; --mint:#2a9d8f;
  --ink:#3b2a20; --ink-2:#6b5646; --line:rgba(138,90,54,.2); --card:#fffdf8; --bg:#f6ecdc;
  --font:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; --font-title:'Jua','Noto Sans KR',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#fbefe0;--ink-2:#d8c3ae;--line:rgba(247,201,72,.22);--card:#2a211b;--bg:#1d1713;--paper:#2a211b}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
main{max-width:760px;margin:0 auto}
h1{font:400 28px/1.2 var(--font-title);margin:6px 0 4px;color:var(--crust-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h1{color:var(--butter)}}
h1 small{display:block;font:500 13px/1.4 var(--font);color:var(--ink-2);margin-top:6px}
h2{font:400 21px/1.3 var(--font-title);margin:0 0 4px}
h3{font:700 15px/1.4 var(--font);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:14px 0;box-shadow:0 6px 18px rgba(90,58,26,.08)}
.muted{color:var(--ink-2);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{appearance:none;border:0;border-radius:999px;padding:10px 16px;min-height:44px;font:700 14px/1.2 var(--font);cursor:pointer;background:rgba(127,127,127,.14);color:var(--ink)}
.btn:hover{filter:brightness(.97)}
.btn:disabled{opacity:.5;cursor:default}
.btn.kakao{background:#fee500;color:#191919}
.btn.naver{background:#03c75a;color:#fff}
.btn.go{background:var(--berry);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
code.key{display:inline-block;max-width:100%;overflow-wrap:anywhere;font:600 13px/1.4 ui-monospace,Menlo,Consolas,monospace;background:rgba(127,127,127,.12);padding:6px 9px;border-radius:10px}
.shop{border-left:6px solid var(--c,#e8546a)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:10px}
.slot{border:1px solid var(--line);border-radius:14px;padding:12px}
.slot .pv{position:relative;margin:8px 0;border-radius:10px;overflow:hidden;background:repeating-conic-gradient(rgba(127,127,127,.12) 0% 25%,transparent 0% 50%) 50%/16px 16px;aspect-ratio:var(--a,4)}
.slot .pv img,.slot .pv canvas{display:block;width:100%;height:100%;object-fit:cover}
.slot .pv .empty{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--ink-2);text-align:center;padding:6px}
.slot .tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:rgba(42,157,143,.16);color:var(--mint);margin-left:6px;vertical-align:middle}
.slot .opts{display:none;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 8px;font-size:13px}
.slot.picking .opts{display:flex}
.slot label.file{position:relative;overflow:hidden}
.slot label.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.msg{min-height:20px;font-size:13px;margin-top:6px}
.msg.ok{color:var(--mint)} .msg.no{color:var(--berry)}
ul.steps{margin:6px 0 0;padding-left:20px}
a{color:inherit}
</style>
</head>
<body>
<main>
  <h1>🎨 가게 꾸미기 <small>세웅이형과 함께하는 대전 빵지순례 v5.0 · 가게 사장님 전용 · 내 가게 간판과 빵콘서트 부스의 그림을 바꿔요</small></h1>
  <div id="app"><div class="card">불러오는 중…</div></div>
  <p class="muted">올린 그림은 메타버스에 들어오는 모든 사람에게 보여요. 가게 로고·간판 사진처럼 가게를 알리는 그림만 올려 주세요. 다른 사람의 저작물이나 사진 속 얼굴은 허락을 받은 것만 올려요. <a href="index.html">← 메타버스로 돌아가기</a></p>
</main>
